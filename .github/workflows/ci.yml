name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements.txt
      - run: python -m pip install pytest==8.4.2 pytest-asyncio==1.2.0 pyte==0.8.2
      - run: python -m pytest -q
      - run: python -m compileall -q lens.py viewer.py launcher.py file_viewer_bridge.py scripts
