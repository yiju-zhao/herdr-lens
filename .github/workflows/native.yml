name: Build native viewer
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  viewer:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: rustup toolchain install 1.96.1 --profile minimal --component rustfmt --component clippy
      - run: rustup default 1.96.1
      - run: python scripts/build_native.py viewer --prepare-only
      - run: cargo fmt --check && cargo clippy --locked --all-targets -- -D warnings && cargo test --locked
        working-directory: build/sources/viewer
      - run: python scripts/build_native.py viewer
      - uses: actions/upload-artifact@v4
        with:
          name: viewer-${{ matrix.os }}
          path: build/herdr-file-viewer-lens
